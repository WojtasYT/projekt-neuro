name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/app/build.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Unit tests, lint and debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain --stacktrace 2>&1 | tee build.log || {
            set +e
            echo "## Android build failed" >> "$GITHUB_STEP_SUMMARY"
            {
              echo "=== compiler errors ==="
              grep -E "^e: " build.log | head -60
              echo "=== likely failure lines ==="
              grep -E "(FAILED|Execution failed|What went wrong|Lint found|lint.*error|tests? (completed|failed)|> [A-Za-z ]*[Ll]int)" build.log | head -80
              echo "=== tail ==="
              tail -n 60 build.log
            } > ci-errors.txt
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' ci-errors.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:900}"
            done
            echo "----- tail of build.log -----" >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
